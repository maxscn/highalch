packages:
  - packages/*

catalogMode: prefer

# Supply-chain policy. A version must have been on the registry for three days before it can be
# installed, so a hijacked release is likely to be pulled before it reaches this repository.
# Dependencies may not run install scripts unless listed under `allowBuilds`, and transitive
# dependencies may not come from git or tarball URLs.
minimumReleaseAge: 4320
strictDepBuilds: true
blockExoticSubdeps: true

catalog:
  "@alchemy.run/domain": 2.0.0-beta.87
  "@changesets/cli": ^3.0.3
  "@effect/atom-react": 4.1.4
  "@tanstack/db": 1.0.0-rc.1.5
  "@tanstack/react-db": 1.0.0-rc.1.5
  "@tanstack/react-form": 1.33.5
  "@types/node": ^24
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@xstate/effect": 1.0.0-beta.2
  effect: 4.1.4
  happy-dom: 20.11.1
  react: 19.2.7
  react-dom: 19.2.7
  takumi-js: 2.14.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  xstate: 6.0.0-beta.3
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
