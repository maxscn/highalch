packages:
  - packages/*
  - console/*

catalogMode: prefer

# Supply-chain policy. A version must have been on the registry for three days before it can be
# installed, so a hijacked release is likely to be pulled before it reaches this repository.
# Dependencies may not run install scripts unless listed under `allowBuilds`, and transitive
# dependencies may not come from git or tarball URLs.
minimumReleaseAge: 4320
strictDepBuilds: true
blockExoticSubdeps: true
allowBuilds:
  # The Console's Worker runs locally in workerd (`alchemy dev`, console/server); its install
  # script fetches the platform's workerd binary.
  workerd: true

catalog:
  "@alchemy.run/better-auth": 2.0.0-beta.87
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  "@alchemy.run/domain": 2.0.0-beta.87
  "@alchemy.run/stripe": 2.0.0-beta.87
  "@base-ui/react": 1.9.0
  "@changesets/cli": ^3.0.3
  "@cloudflare/workers-types": 5.20261026.1
  "@distilled.cloud/stripe": 1.0.0-rc.20
  "@effect/atom-react": 4.1.4
  "@effect/platform-node": 4.1.4
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "@playwright/test": 1.63.0
  "@tailwindcss/vite": 4.3.5
  "@tanstack/db": 1.0.0-rc.1.5
  "@tanstack/react-db": 1.0.0-rc.1.5
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.5
  "@types/node": ^24
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@types/ws": 8.18.1
  "@vitejs/plugin-react": 6.3.0
  "@xstate/effect": 1.0.0-beta.2
  alchemy: 2.0.0-beta.87
  better-auth: 1.7.21
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  effect: 4.1.4
  fast-check: 4.10.2
  happy-dom: 20.11.1
  react: 19.2.7
  react-dom: 19.2.7
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  takumi-js: 2.14.0
  tw-animate-css: 1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  ws: 8.20.0
  xstate: 6.0.0-beta.3
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
